# git-cliff configuration — https://git-cliff.org
# Release notes from Conventional Commits. Plain, grouped, quiet.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.\n
"""
# Tera template. `<!-- NN -->` prefixes only order the groups; `striptags` drops them.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# false: a commit that fails strict Conventional Commits parsing still reaches commit_parsers
# (caught by the trailing catch-all below) instead of being silently dropped from the notes.
filter_unconventional = false
split_commits = false
# First match wins. Deps before the maintenance catch-all; breaking first.
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 00 -->Breaking changes" },
  # `footer` and `body` both: git-cliff matches `body` against the parsed conventional
  # body, which EXCLUDES footers, so the canonical `BREAKING CHANGE: …` trailer only
  # matches via `footer`. Keeping `body` too still catches the words used mid-prose.
  { footer = ".*BREAKING CHANGE", group = "<!-- 00 -->Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "<!-- 00 -->Breaking changes" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  # Documentation here is process, not product. Every `docs` commit this repository has ever had is
  # either `docs(speckit)` — spec-kit artifacts, which AGENTS.md makes mandatory, so they must exist —
  # or `docs(agents)`, the agent guide. Neither ships in the artifact, and a consumer reading the notes
  # has no use for "add 006-v2-cleanup-sweep spec/plan/tasks" or "name KafkaFailureModesGatlingTest in
  # the Test Model". Skipped from the notes, kept in the history.
  #
  # One blanket rule rather than a skip per scope: an enumerated list has to be extended for every new
  # kind of internal doc, and it was carving exceptions out of a general `^docs` -> Documentation rule
  # that had never once matched a consumer-facing commit. If a genuinely user-facing docs commit ever
  # lands — a README change someone needs to read about — give it its own group rule then, against a
  # real commit instead of a hypothetical one.
  { message = "^docs", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 05 -->Dependencies" },
  # Scala Steward commits `Update <artifact>[, <artifact>…] to <version>` — its own template,
  # with no Conventional Commits prefix — so the rule above never sees them and they fell through
  # to the catch-all, landing three dependency bumps under "Other" in the v2.0.0 notes. Anchored on
  # that exact shape rather than a bare `^Update`: the trailing version is what distinguishes a
  # bump from prose, and `to [0-9]` still matches the `(#245)` suffix a squash merge appends.
  # A human commit could only collide with this by already violating the Conventional Commits
  # rule AGENTS.md sets for every commit in this repository.
  { message = "^Update .+ to [0-9]", group = "<!-- 05 -->Dependencies" },
  { message = "^(refactor|test|ci|build|chore|style|revert)", group = "<!-- 06 -->Maintenance" },
  # Catch-all: a non-Conventional-Commit message still ships (e.g. an older or squash-merged commit)
  # instead of silently vanishing from the notes.
  { message = ".*", group = "<!-- 07 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
