name: Release

# Manual, tag-driven releases.
# Trunk is `main`; `release/*` branches are cut from `main` for stabilization.
# Pushing a `vX.Y.Z` tag on `main` or a `release/*` branch publishes to Sonatype
# (via sbt-ci-release / dynver) and creates a GitHub Release with git-cliff notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SBT_OPTS: -Dsbt.color=true -Dsbt.log.noformat=false -Dsbt.supershell=false
  JAVA_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  JVM_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  FORCE_COLOR: "1"
  TERM: xterm-256color

jobs:
  release:
    name: Release (tag-driven)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag & resolve changelog range
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git branch -r --contains "$TAG" | grep -qE 'origin/(release/|main$)' \
            || { echo "::error::Tag $TAG is not on main or release/*"; exit 1; }
          PREV=$(git describe --tags --abbrev=0 --first-parent "${TAG}^" --match 'v[0-9]*' 2>/dev/null || true)
          # No reachable previous tag (first release, or a tag on a release/* branch that
          # was never merged back): fall back to --latest. Passing no range at all makes
          # git-cliff regenerate the WHOLE history into this release's body.
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="--latest"
            echo "::notice::No previous v* tag reachable from ${TAG}; using --latest."
          fi
          echo "cliff_args=${RANGE} --strip header" >> "$GITHUB_OUTPUT"

      - name: Setup Java (Temurin 17) with sbt cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache Coursier
        uses: coursier/cache-action@v8
      - name: Cache Ivy/SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # Unit + Testcontainers integration specs. The Gatling example simulations
      # need the full Kafka/Schema Registry stack and already gate `main` in ci.yml,
      # so the tag (cut from `main`) has been through them.
      - name: Compile & test
        timeout-minutes: 15
        run: sbt clean compile test

      - name: Publish to Sonatype via sbt-ci-release
        timeout-minutes: 10
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: ${{ steps.prep.outputs.cliff_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ steps.changelog.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify Maven Central / GitHub Release parity
    # needs + if:always() (not a step in the release job) so this still runs, and can
    # still fail loudly, even if `release` itself failed or was cancelled after
    # `sbt ci-release` had already published -- v2.1.0 did exactly this: the publish
    # step succeeded but a later step didn't, leaving Maven Central ahead of GitHub
    # Releases with nothing surfacing the gap until someone noticed weeks later.
    needs: release
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare Maven Central against the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          POM_URL="https://repo1.maven.org/maven2/org/galaxio/gatling-kafka-plugin_2.13/${VERSION}/gatling-kafka-plugin_2.13-${VERSION}.pom"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$POM_URL")
          if [ "$STATUS" != "200" ]; then
            echo "::notice::${TAG} isn't visible on Maven Central yet (HTTP ${STATUS}); Central sync can lag well past this job. Nothing to verify."
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${TAG} is on Maven Central and has a matching GitHub Release."
          else
            echo "::error::${TAG} is published on Maven Central but has no matching GitHub Release. The release job likely failed or was cancelled after the Sonatype publish step succeeded -- investigate the run and create the release manually."
            exit 1
          fi
