name: Continuous Integration

# Test-only. Releases are tag-driven and live in release.yml.
on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: -Dsbt.color=true -Dsbt.log.noformat=false -Dsbt.supershell=false
  JAVA_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  JVM_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  FORCE_COLOR: "1"
  TERM: xterm-256color

jobs:
  test:
    name: Lint, Compile & Test
    runs-on: ubuntu-24.04
    services:
      zookeeper:
        image: wurstmeister/zookeeper
        env:
          ZOO_MY_ID: "1"
          ZOO_PORT: "2181"
          ZOO_SERVERS: server.1=zoo1:2888:3888
        ports:
          - '2181:2181'
      kafka:
        image: wurstmeister/kafka:2.13-2.8.1
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_HOST_NAME: kafka
          KAFKA_LISTENERS: BROKER://:9092,EXTERNAL://:9093
          KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
          KAFKA_BROKER_ID: "1"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          # group.initial.rebalance.delay.ms is deliberately left at Kafka's default, matching
          # docker-compose.kafka.yml. It was pinned to 0 while reply-channel readiness completed on
          # assignment alone (issue #193); with the fetch position now resolved before readiness
          # completes, CI runs on the same setting a real target system would.
          #
          # Must stay in step with docker-compose.kafka.yml's topic-init: this is a separate broker
          # definition, so a topic added there is NOT created here. myTopic5/test.t5 serve the keyless
          # request-reply scenarios (#167), myTopic6/test.t6 the tombstone one (#168), and
          # load.request/load.reply are KafkaConcurrencyLoadTest's, which previously relied on
          # broker auto-create. The ex.<lang>.<example>.t topics are the published example
          # simulations' — one per example, never shared, so a record one example leaves behind
          # cannot satisfy the next one's reply.
          KAFKA_CREATE_TOPICS: "myTopic1:1:1, test.t1:1:1, myTopic2:1:1, test.t2:1:1, myTopic3:1:1, test.t3:1:1, myTopic4:1:1, myTopic5:1:1, test.t5:1:1, myTopic6:1:1, test.t6:1:1, load.request:1:1, load.reply:1:1, ex.scala.avro4s.t:1:1, ex.scala.avrorr.t:1:1, ex.scala.basic.t:1:1, ex.scala.match.t:1:1, ex.scala.producer.t:1:1, ex.java.avrorr.t:1:1, ex.java.basic.t:1:1, ex.java.match.t:1:1, ex.java.producer.t:1:1, ex.kotlin.avrorr.t:1:1, ex.kotlin.basic.t:1:1, ex.kotlin.match.t:1:1, ex.kotlin.producer.t:1:1"
        ports:
          - '9092:9092'
          - '9093:9093'
      schema-registry:
        image: confluentinc/cp-schema-registry:7.2.1
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092,localhost:9093'
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:9094
        ports:
          - '9094:9094'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 17) with sbt cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: coursier/cache-action@v8

      - name: Cache Ivy/SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # The example projects resolve their own graphs, so they need their own caches — otherwise every
      # run re-downloads Gatling, the Confluent artifacts, the Gradle distribution and the Kotlin
      # compiler, which is the cost the sbt caching above exists to avoid.
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('examples/java/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('examples/kotlin/**/*.kts', 'examples/kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The .githooks/pre-commit hook formats before every commit, so a plain
      # check is enough here — a failure means the hook was bypassed or never
      # installed (scripts/install-hooks.sh).
      - name: Check Formatting
        run: sbt scalafmtCheckAll scalafmtSbtCheck

      - name: Compile
        run: sbt clean compile

      # Needs no broker: it checks that every example on disk has recorded coverage, and that the
      # topics they use are disjoint and created by both broker definitions. A topic clash has to be
      # caught before the simulations run — afterwards it looks like a plugin correlation bug.
      - name: Check example coverage contract
        run: sbt "Test / runMain org.galaxio.gatling.kafka.examples.ExampleCoverageCheck"

      # `Gatling / test` is sbt's own Gatling task, and it picks up every simulation on the test
      # classpath — the three test harnesses — so one added later is covered without editing this
      # file. It replaced three hand-listed `testOnly` invocations; the reason each of those mattered
      # is worth keeping:
      #
      #   KafkaConcurrencyLoadTest is the only *sustained* concurrent request-reply coverage — 30
      #   virtual users held for 100 s with a zero reply-loss budget, so any loss fails the build
      #   (issue #167). KafkaGatlingTest's keyless scenarios inject a handful of concurrent users,
      #   enough to observe cross-attribution but not to hold load. KafkaJavaapiMethodsGatlingTest is
      #   Scala driving the Java facade, so the facade keeps end-to-end coverage here even though the
      #   Java examples run in their own project.
      #
      # Dropping any of them from the suite would be a real loss of coverage, not a tidy-up.
      - name: Test (Gatling + unit, under coverage)
        run: sbt coverage "Gatling / test" test coverageOff coverageReport

      # The examples live in three consumer projects, one per language, each on the build tool its
      # users actually use and each depending on the published artifact — the same shape Gatling ships
      # its own demo projects in. That also exercises the coordinates README.md tells consumers to
      # declare, including the Confluent repository for Avro, which nothing else checks.
      #
      # The sentinel version keeps the coordinate stable: dynver's real version changes every commit
      # and gains a timestamp on a dirty tree.
      - name: Publish the plugin for the example projects
        run: sbt 'set ThisBuild / version := "0.0.0-EXAMPLES-SNAPSHOT"' publishM2

      - name: Run Scala examples
        run: sbt "Gatling / test"
        working-directory: examples/scala

      - name: Run Java examples
        run: mvn -B -f examples/java/pom.xml verify

      # Gradle 8.12, pinned by the committed wrapper: io.gatling.gradle 3.13.5.4 is the release that
      # matches Gatling 3.13.5, and it cannot configure on Gradle 9 (it calls Project#javaexec and the
      # Convention API, both removed in 9.0). Do not bump the wrapper without bumping the plugin.
      - name: Run Kotlin examples
        run: ./gradlew gatlingRun --all --console=plain
        working-directory: examples/kotlin

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: false
