version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "01:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "01:20"
      timezone: Etc/UTC
    commit-message:
      prefix: "chore"
